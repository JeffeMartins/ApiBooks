name: api-books
services:
  mongo:
    image: mongo:8
    command: [mongod, --replSet, rs0, --bind_ip_all]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id:0,host:\"mongo:27017\"}] }).ok }'"]
      interval: 5s
      retries: 20
  init:
    build:
      context: .
      target: build
    command: npm run db:push
    environment:
      DATABASE_URL: mongodb://mongo:27017/bookStore?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
  api:
    build: .
    ports: ["127.0.0.1:3002:3002"]
    environment:
      PORT: 3002
      DATABASE_URL: mongodb://mongo:27017/bookStore?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET}
    depends_on:
      init:
        condition: service_completed_successfully
volumes:
  mongo-data:
